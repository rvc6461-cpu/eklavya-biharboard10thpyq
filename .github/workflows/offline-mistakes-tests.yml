name: Offline Mistake Notebook Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run offline-only persistence suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run offline mistake notebook tests
        run: |
          for i in 1 2 3; do
            echo "::group::Attempt $i/3"
            bunx vitest run src/lib/pyq/store.test.ts
            EXIT_CODE=$?
            echo "::endgroup::"
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Attempt $i/3 succeeded."
              exit 0
            fi
            echo "❌ Attempt $i/3 failed with exit code $EXIT_CODE."
            if [ $i -lt 3 ]; then
              echo "⏳ Retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "🚨 All 3 attempts exhausted — treating as persistent failure."
          exit 1
