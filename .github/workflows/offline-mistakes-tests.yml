name: Offline Mistake Notebook Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run offline-only persistence suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run offline mistake notebook tests
        run: bunx vitest run src/lib/pyq/store.test.ts
